<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Living Room Context Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --sky1:#1d2140;--sky2:#3a2f55;
  --ink:#f5efe4;--ink2:#c9c0d6;--lamp:#f4b766;--alert:#ff8a6b;--toastfg:#1d2140;--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.16);
  --serif:"Fraunces",Georgia,serif;--sans:"Instrument Sans",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="light"]{color-scheme:light;--ink:#1f1b2e;--ink2:#524c68;--lamp:#c97a1c;--alert:#b83c22;--panel:rgba(255,255,255,.62);--line:rgba(31,27,46,.22);--toastfg:#f5efe4}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:linear-gradient(160deg,var(--sky1),var(--sky2));color:var(--ink);font-family:var(--sans);font-size:clamp(16px,1.5vw,24px);transition:background 1.5s}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s}
main{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(20px,3vw,56px);padding:clamp(20px,4vw,72px);min-height:100vh}
.left{display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.greet{color:var(--ink2);font-size:1.3em;margin:0}
.clock{font-family:var(--serif);font-weight:300;font-size:clamp(88px,15vw,260px);line-height:.9;letter-spacing:-.03em;margin:.1em 0 0}
.clock small{font-size:.22em;letter-spacing:0;margin-left:.2em;color:var(--lamp)}
.date{font-size:1.2em;color:var(--ink2);margin:.4em 0 0}
.arc{width:min(100%,520px)}
.arc text{fill:var(--ink2);font-size:13px;font-family:var(--sans)}
.right{display:flex;flex-direction:column;gap:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:1.1em 1.3em}
.wx{display:flex;align-items:center;gap:1em}
.wx .t{font-family:var(--serif);font-size:3.6em;font-weight:300;line-height:1}
.wx .d{color:var(--ink2)}
.wx svg{width:3.6em;height:3.6em;flex:none}
.summary{max-width:36em}.summary p{margin:0 0 .5em;font-family:var(--serif);font-size:1.2em;line-height:1.45}.summary small{color:var(--ink2)}
.alerts h2,.actions h2,.summary h2{font-size:1em;font-weight:600;margin:0 0 .6em;color:var(--ink2)}
.alert{display:flex;gap:.8em;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-left:4px solid var(--line);border-radius:6px;color:var(--ink);font:inherit;padding:.5em .8em;margin-bottom:.4em;cursor:pointer}
.alert.high{border-left-color:var(--alert);background:rgba(255,138,107,.1)}
.alert b{display:block;font-weight:600}
.alert span{color:var(--ink2);font-size:.85em}
.empty{color:var(--ink2);margin:0}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.chip{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:.9em 1em;text-align:left;cursor:pointer}
.chip small{display:block;color:var(--ink2);margin-top:.2em}
.chip[aria-pressed=true]{background:var(--lamp);color:#2a1d0e;border-color:var(--lamp)}
.chip[aria-pressed=true] small{color:#4a3719}
:is(.chip,.alert,.mic,input):focus-visible{outline:4px solid var(--ink);outline-offset:3px;transform:scale(1.03)}
.voice{display:flex;gap:12px;align-items:center}
.mic{flex:none;width:3.2em;height:3.2em;border-radius:50%;border:0;background:var(--lamp);color:#2a1d0e;font:inherit;font-weight:600;cursor:pointer}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(244,183,102,.25)}}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:.8em 1em}
input::placeholder{color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:4vh;transform:translate(-50%,20px);background:var(--ink);color:var(--toastfg);padding:.7em 1.3em;border-radius:99px;opacity:0;transition:.3s;font-weight:600;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){main{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="dim"></div>
<main>
  <section class="left" aria-label="Time">
    <div>
      <p class="greet" id="greet"></p>
      <h1 class="clock" id="clock" aria-live="off"></h1>
      <p class="date" id="date"></p>
    </div>
    <div class="panel summary"><h2>Today at a glance</h2><p id="sum" aria-live="polite">Writing your summary…</p><small>Written by Bedrock (mock for now)</small></div>
    <svg class="arc" viewBox="0 0 520 170" role="img" aria-label="Daylight progress">
      <path d="M20 150 A240 240 0 0 1 500 150" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="2" stroke-dasharray="4 8"/>
      <circle id="sun" r="11" fill="#f4b766"/>
      <text x="20" y="168">Sunrise 6:12</text><text x="500" y="168" text-anchor="end">Sunset 18:04</text>
    </svg>
  </section>

  <section class="right">
    <div class="panel wx" id="wx" aria-live="polite">Loading weather…</div>

    <div class="panel alerts">
      <h2>Needs your attention</h2>
      <div id="alerts"></div>
    </div>

    <div class="panel actions">
      <h2>Quick actions</h2>
      <div class="chips" id="chips"></div>
    </div>

    <div class="voice">
      <button class="mic" id="mic" aria-label="Start voice command">Talk</button>
      <input id="cmd" placeholder="Say or type: “dim the lights”" aria-label="Voice command">
    </div>
  </section>
</main>
<div id="toast" role="status"></div>

<script>
// ---------- Mock API layer: swap these for real endpoints (API Gateway + Lambda) ----------
const wait = (v, ms = 350) => new Promise(r => setTimeout(() => r(v), ms));
const api = {
  weather: () => wait({ temp: 24 + Math.round(Math.random() * 2), feels: 26, cond: "Partly cloudy", hi: 29, lo: 19, rain: 10 }),
  alerts: () => wait([
    { id: 1, level: "high", title: "Front door unlocked", sub: "Since 9:42 PM" },
    { id: 2, level: "high", title: "Package delivered", sub: "Left on the porch at 6:15 PM" },
    { id: 3, level: "low", title: "Software update ready", sub: "Fire TV will restart tonight" }
  ])
};

// ---------- State ----------
const state = { light: !!(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches), summary: false, lights: false, movie: false, door: true, night: false, alerts: [] };
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");

// ---------- Clock, greeting, sky ----------
function tick() {
  const d = new Date(), h = d.getHours();
  const h12 = h % 12 || 12;
  $("clock").innerHTML = h12 + ":" + pad(d.getMinutes()) + "<small>" + (h < 12 ? "am" : "pm") + "</small>";
  $("date").textContent = d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  $("greet").textContent = h < 5 ? "Still up?" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 21 ? "Good evening" : "Winding down";
  const lt = document.documentElement.dataset.theme === "light";
  const skies = lt ? (h >= 6 && h < 17 ? ["#dcebf7", "#f7e3c4"] : h >= 17 && h < 20 ? ["#f3d9d0", "#e8c3d6"] : ["#d9d7ea", "#e6dff0"])
    : h >= 6 && h < 17 ? ["#2a4a7f", "#e0a96d"] : h >= 17 && h < 20 ? ["#3b2c5a", "#c8685a"] : ["#14172e", "#32284c"];
  document.documentElement.style.setProperty("--sky1", skies[0]);
  document.documentElement.style.setProperty("--sky2", skies[1]);
  const p = Math.min(1, Math.max(0, (h + d.getMinutes() / 60 - 6) / 12));
  const a = Math.PI * (1 - p);
  $("sun").setAttribute("cx", 260 + 240 * Math.cos(a));
  $("sun").setAttribute("cy", 150 - 240 * Math.sin(a) + 0);
}
setInterval(tick, 1000); tick();

// ---------- Weather ----------
function icon(c) {
  return '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="24" cy="24" r="10" fill="#f4b766"/><path d="M22 50h26a9 9 0 0 0 0-18 13 13 0 0 0-25-3 10 10 0 0 0-1 21z" fill="#f5efe4" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/></svg>';
}
async function loadWeather() {
  const w = await api.weather(); state.w = w;
  $("wx").innerHTML = icon(w.cond) + '<div class="t">' + w.temp + '°</div><div class="d"><div>' + w.cond + '</div><div>High ' + w.hi + '° · Low ' + w.lo + '° · Rain ' + w.rain + '%</div></div>';
  return w;
}
loadWeather(); setInterval(loadWeather, 60000);

// ---------- Alerts ----------
function renderAlerts() {
  const box = $("alerts");
  if (!state.alerts.length) { box.innerHTML = '<p class="empty">All clear. Nothing needs you right now.</p>'; return; }
  box.innerHTML = "";
  state.alerts.forEach(a => {
    const b = document.createElement("button");
    b.className = "alert " + a.level; b.dataset.nav = 1;
    b.innerHTML = "<div><b>" + a.title + "</b><span>" + a.sub + " · Press select to dismiss</span></div>";
    b.onclick = () => { dismiss(a.id); };
    box.appendChild(b);
  });
}
function dismiss(id) {
  const a = state.alerts.find(x => x.id === id); if (!a) return;
  state.alerts = state.alerts.filter(x => x.id !== id); renderAlerts();
  toast("Dismissed: " + a.title); focusFirst(); resum();
}
api.alerts().then(a => { state.alerts = a; renderAlerts(); summarize(); });

// ---------- Quick actions ----------
const actions = [
  { k: "lights", label: "Dim lights", on: "Lights at 30%", off: "Lights at full" },
  { k: "movie", label: "Movie mode", on: "On · screen dimmed", off: "Off" },
  { k: "door", label: "Lock front door", on: "Locked", off: "Unlocked" },
  { k: "night", label: "Good night", on: "Everything off", off: "Tap to wind down" },
  { k: "light", label: "Light theme", on: "Light", off: "Dark" },
  { k: "summary", label: "Refresh summary", on: "", off: "Get a fresh brief" }
];
function renderChips() {
  $("chips").innerHTML = "";
  actions.forEach(a => {
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.nav = 1; b.setAttribute("aria-pressed", state[a.k]);
    b.innerHTML = a.label + "<small>" + (state[a.k] ? a.on : a.off) + "</small>";
    b.onclick = () => a.k === "summary" ? summarize(true) : toggle(a.k);
    $("chips").appendChild(b);
  });
  $("dim").style.opacity = state.night ? .75 : state.movie ? .55 : state.lights ? .25 : 0;
}
function toggle(k, v) {
  const was = document.activeElement && document.activeElement.textContent;
  state[k] = v === undefined ? !state[k] : v;
  if (k === "door" && state.door) state.alerts = state.alerts.filter(a => a.id !== 1), renderAlerts();
  if (k === "night" && state.night) { state.lights = true; state.movie = false; state.door = true; state.alerts = state.alerts.filter(a => a.id !== 1); renderAlerts(); }
  renderChips();
  const a = actions.find(x => x.k === k);
  toast(a.label + ": " + (state[k] ? a.on : a.off));
  if (k === "light") applyTheme();
  resum();
  const i = actions.findIndex(x => x.k === k);
  const el = $("chips").children[i]; if (el && document.activeElement !== $("cmd")) el.focus();
}
renderChips();

// ---------- Voice / text commands ----------
function run(text) {
  const t = text.toLowerCase();
  if (/summary|brief|catch me up|today/.test(t)) return summarize(true);
  if (/theme|dark mode|light mode/.test(t)) return toggle("light", !/dark/.test(t));
  if (/weather|temperature|rain/.test(t)) return loadWeather().then(w => toast("It’s " + w.temp + "° and " + w.cond.toLowerCase() + ". Rain chance " + w.rain + "%."));
  if (/dim|light/.test(t)) return toggle("lights", !/(full|bright|on)\b/.test(t) || /dim/.test(t));
  if (/movie|film|cinema/.test(t)) return toggle("movie", !/off|stop/.test(t));
  if (/lock|door/.test(t)) return toggle("door", !/unlock/.test(t));
  if (/night|sleep|bed/.test(t)) return toggle("night", true);
  if (/dismiss|clear|ok|okay|got it/.test(t)) { const a = state.alerts[0]; return a ? dismiss(a.id) : toast("No alerts to dismiss"); }
  if (/alert|what.?s up|notif/.test(t)) return toast(state.alerts.length ? state.alerts.length + " alert(s). First: " + state.alerts[0].title : "All clear");
  toast("Sorry, I didn’t catch that. Try “dim the lights”.");
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$("mic").onclick = () => {
  if (!SR) { toast("Voice isn’t supported here. Type a command instead."); $("cmd").focus(); return; }
  const r = new SR(); r.lang = "en-US";
  $("mic").classList.add("on");
  r.onresult = e => { const s = e.results[0][0].transcript; $("cmd").value = s; run(s); };
  r.onerror = () => { toast("Couldn’t hear you. Type a command instead."); $("cmd").focus(); };
  r.onend = () => $("mic").classList.remove("on");
  try { r.start(); } catch (e) { $("mic").classList.remove("on"); }
};
$("cmd").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.value.trim()) { run(e.target.value); e.target.value = ""; }
  e.stopPropagation();
});

// ---------- Theme ----------
function applyTheme() { document.documentElement.dataset.theme = state.light ? "light" : "dark"; tick(); }
applyTheme();

// ---------- Daily summary (mock of an Amazon Bedrock call) ----------
// Real version: POST buildPrompt(ctx) to a Lambda behind API Gateway, which calls Bedrock InvokeModel and returns the text.
function buildPrompt(c) {
  return "You are a calm home assistant. In two short sentences summarise this for someone on the sofa. Weather: " + JSON.stringify(c.w) + ". Alerts: " + JSON.stringify(c.alerts) + ". Movie mode: " + c.movie + ".";
}
function compose(c) {
  const h = new Date().getHours(), part = h < 12 ? "morning" : h < 17 ? "afternoon" : "evening";
  const wx = c.w.cond.toLowerCase() + " at " + c.w.temp + "°" + (c.w.rain > 40 ? ", so take an umbrella" : ", with little chance of rain");
  const n = c.alerts.length, hi = c.alerts.filter(a => a.level === "high");
  const al = !n ? "Nothing needs your attention."
    : hi.length ? hi[0].title + (n > 1 ? " and " + (n - 1) + " more item" + (n > 2 ? "s" : "") : "") + (n === 1 ? " needs" : " need") + " a look."
    : n + " low-priority item" + (n > 1 ? "s" : "") + " can wait.";
  const extra = c.night ? " Good night. Everything is set." : c.movie ? " Movie mode is on, so I’ll keep things quiet." : "";
  return "This " + part + " is " + wx + ". " + al + extra;
}
api.summary = ctx => wait(compose(ctx), 900);
async function summarize(fresh) {
  $("sum").textContent = "Writing your summary…";
  if (!state.w) await loadWeather();
  const text = await api.summary({ w: state.w, alerts: state.alerts, movie: state.movie, night: state.night });
  $("sum").textContent = text;
  if (fresh) toast("Summary updated");
}
var rt;
function resum() { clearTimeout(rt); rt = setTimeout(() => summarize(), 600); }

// ---------- Toast ----------
let tt;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 3200); }

// ---------- D-pad (arrow key) navigation for TV remotes ----------
const navEls = () => [...document.querySelectorAll("[data-nav],#mic")];
function focusFirst() { const e = navEls()[0]; if (e) e.focus(); }
document.addEventListener("keydown", e => {
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const d = dirs[e.key]; if (!d) return;
  e.preventDefault();
  const els = navEls(), cur = document.activeElement;
  if (!els.includes(cur)) { focusFirst(); return; }
  const c = cur.getBoundingClientRect(), cx = c.left + c.width / 2, cy = c.top + c.height / 2;
  let best = null, bs = 1e9;
  els.forEach(el => {
    if (el === cur) return;
    const r = el.getBoundingClientRect(), dx = r.left + r.width / 2 - cx, dy = r.top + r.height / 2 - cy;
    const along = dx * d[0] + dy * d[1]; if (along <= 0) return;
    const across = Math.abs(dx * d[1]) + Math.abs(dy * d[0]);
    const s = along + across * 2; if (s < bs) { bs = s; best = el; }
  });
  if (best) best.focus();
});
focusFirst();
</script>
</body>
</html>
